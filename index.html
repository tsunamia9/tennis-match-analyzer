<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tennis Match Analyzer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 40px;
    }

    .players {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: #1f2937;
      padding: 25px;
      border-radius: 15px;
      border: 1px solid #374151;
    }

    .card h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    button {
      display: block;
      margin: 0 auto 40px;
      padding: 14px 30px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }

    .stats {
      background: #1f2937;
      padding: 30px;
      border-radius: 15px;
      border: 1px solid #374151;
    }

    .stats h2 {
      margin-bottom: 25px;
    }

    .stat {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      padding: 15px 0;
      border-bottom: 1px solid #374151;
      text-align: center;
    }

    .stat:last-child {
      border-bottom: none;
    }

    .label {
      color: #9ca3af;
    }

    @media (max-width: 700px) {
      .players {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🎾 Tennis Match Analyzer</h1>

    <p class="subtitle">
      Analyze your tennis match statistics
    </p>

    <div class="players">

      <div class="card">
        <h2>Player 1</h2>
        <input type="text" placeholder="Enter player name">
      </div>

      <div class="card">
        <h2>Player 2</h2>
        <input type="text" placeholder="Enter player name">
      </div>

    </div>

    <button>Analyze Match</button>

    <div class="stats">

      <h2>📊 Match Statistics</h2>

      <div class="stat">
        <span class="label">Statistic</span>
        <strong>Player 1</strong>
        <strong>Player 2</strong>
      </div>

      <div class="stat">
        <span class="label">First Serve</span>
        <span>68%</span>
        <span>61%</span>
      </div>

      <div class="stat">
        <span class="label">Winners</span>
        <span>32</span>
        <span>27</span>
      </div>

      <div class="stat">
        <span class="label">Unforced Errors</span>
        <span>18</span>
        <span>24</span>
      </div>

      <div class="stat">
        <span class="label">Break Points</span>
        <span>7/12</span>
        <span>4/9</span>
      </div>

    </div>

  </div>

</body>
</html>
